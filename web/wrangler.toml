name = "hfos"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Static assets (Next.js output) served by the Worker.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Cloudflare D1 database (created via MCP; id is live).
[[d1_databases]]
binding = "DB"
database_name = "hfos-db"
database_id = "bd46243a-954d-4465-98ac-7f91e230661b"
migrations_dir = "migrations"

# Workers AI: native LLM binding, no API key/secret to manage. This same
# binding also routes Claude via AI Gateway (provider "ai-gateway"). Powers the
# copilot's natural-language phrasing (numbers still come from the calc engine).
[ai]
binding = "AI"

# Non-secret vars. Secrets (HFOS_SECRET_KEY, HFOS_ENCRYPTION_KEY) are set with
#   wrangler secret put HFOS_SECRET_KEY
# or in the dashboard → Worker → Settings → Variables (encrypted).
#
# HFOS_COPILOT_PROVIDER selects how the copilot phrases answers:
#   "auto"        cost-first (default): free native Workers AI on every request,
#                 spilling over to Claude (AI Gateway) only when the native call
#                 fails, e.g. the daily free-tier allowance is spent. Then rules.
#   "ai-gateway"  Claude first, degrading to the native model, then rules.
#   "anthropic"   direct Anthropic API first; set the ANTHROPIC_API_KEY secret.
#   "workers-ai"  native model only, then rules.
#   "rules"       deterministic, no LLM.
# Every chain ends at the deterministic rule engine, so it never hard-fails.
#
# HFOS_AI_GATEWAY_ID: AI Gateway name for the Claude tier (defaults to "default").
# HFOS_COPILOT_MODEL: override the Claude-tier model (default anthropic/claude-sonnet-4.5);
#   bump it as Cloudflare's catalog lists newer Claude models.
[vars]
HFOS_COPILOT_PROVIDER = "auto"
HFOS_AI_GATEWAY_ID = "hfos"
# Telegram copilot bot. TELEGRAM_BOT_TOKEN + TELEGRAM_WEBHOOK_SECRET are secrets
# (set via GitHub Actions / `wrangler secret put`); the bot stays disabled until
# both are present. TELEGRAM_BOT_USERNAME is a non-secret var used only to build
# the t.me deep link shown in Settings → Connect Telegram. See docs/TELEGRAM_SETUP.md.
TELEGRAM_BOT_USERNAME = "HomeFInanceOS_bot"
# Transactional email sender. hf-os.com is verified in Resend, so mail is sent
# from the domain and delivers to any recipient (password resets, household
# invites). RESEND_API_KEY is an encrypted secret synced from GitHub Actions.
EMAIL_FROM = "HFOS <noreply@hf-os.com>"

# ── Dev environment ───────────────────────────────────────────────────────────
# `wrangler deploy --env dev` deploys the hfos-dev Worker (served at
# hfos-dev.<account>.workers.dev) against its own D1 (hfos-db-dev). Cloudflare
# does NOT inherit bindings/vars into named environments, so they are repeated
# here. Dev deliberately avoids paid/external services: copilot uses the free
# native Workers AI, email is off (no RESEND key), and auth allows the insecure
# signing key (HFOS_ALLOW_INSECURE_SECRET) since dev has no real users.
[env.dev]
name = "hfos-dev"

[env.dev.assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "hfos-db-dev"
database_id = "23b5aecd-343d-4c09-bff4-a723ed298ae1"
migrations_dir = "migrations"

[env.dev.ai]
binding = "AI"

[env.dev.vars]
HFOS_COPILOT_PROVIDER = "workers-ai"
HFOS_AI_GATEWAY_ID = "hfos"
HFOS_ALLOW_INSECURE_SECRET = "1"
# Dev Telegram bot username (dev bot created via BotFather).
TELEGRAM_BOT_USERNAME = "HomeFInanceOSDev_bot"
EMAIL_FROM = "HFOS Dev <onboarding@resend.dev>"
