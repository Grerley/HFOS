name: Deploy to Cloudflare (dev)

# Deploys the hfos-dev Worker + hfos-db-dev on every push to develop.
# Dev-specific secrets are name-prefixed with DEV_ (GitHub Free private repos
# can't use per-environment secrets), and synced only when present.

on:
  push:
    branches: [develop]
    paths:
      - "web/**"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build (OpenNext → Workers)
        run: npx opennextjs-cloudflare build
      - name: Apply D1 migrations (dev)
        run: npx wrangler d1 migrations apply hfos-db-dev --remote --env dev
      - name: Deploy Worker (dev)
        run: npx wrangler deploy --env dev
      - name: Sync dev secrets (name-prefixed DEV_*)
        env:
          DEV_HFOS_SECRET_KEY: ${{ secrets.DEV_HFOS_SECRET_KEY }}
          DEV_CRON_SECRET: ${{ secrets.DEV_CRON_SECRET }}
          DEV_TELEGRAM_BOT_TOKEN: ${{ secrets.DEV_TELEGRAM_BOT_TOKEN }}
          DEV_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.DEV_TELEGRAM_WEBHOOK_SECRET }}
        run: |
          put() { if [ -n "$2" ]; then printf '%s' "$2" | npx wrangler secret put "$1" --env dev; else echo "$1 not set (dev) — skipping"; fi; }
          put HFOS_SECRET_KEY "$DEV_HFOS_SECRET_KEY"
          put CRON_SECRET "$DEV_CRON_SECRET"
          put TELEGRAM_BOT_TOKEN "$DEV_TELEGRAM_BOT_TOKEN"
          put TELEGRAM_WEBHOOK_SECRET "$DEV_TELEGRAM_WEBHOOK_SECRET"
