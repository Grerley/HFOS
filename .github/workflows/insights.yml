name: Proactive insights

# Weekly: asks the agentic analyst to review each household's finances and record
# the most important trends/risks/opportunities as Insights (surfaced in the app,
# and pushed to a linked Telegram chat). Runs only when CRON_SECRET is set (the
# endpoint returns 503 otherwise, and this job exits cleanly).
#
# Required GitHub repository secret:
#   CRON_SECRET  — any long random string; must match the value synced to the Worker.
# Optional repository variable:
#   APP_URL      — the deployed app origin (defaults to the production Worker URL).

on:
  schedule:
    - cron: "0 7 * * 1" # 07:00 UTC every Monday
  workflow_dispatch: # allow manual runs from the Actions tab

concurrency:
  group: proactive-insights
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger proactive analysis
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://hfos.geemutibura.workers.dev' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipping (proactive insights disabled)."
            exit 0
          fi
          echo "Calling analysis endpoint at $APP_URL"
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/insights/analyze-all")
          echo "HTTP $code"; cat /tmp/resp.json || true; echo
          if [ "$code" = "503" ]; then echo "Worker reports analysis disabled."; exit 0; fi
          if [ "$code" != "200" ]; then echo "Analysis call failed"; exit 1; fi
